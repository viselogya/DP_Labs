# Лабораторная 1.4. Контроллеры ros_control для манипулятора.
# Тип контроллеров (effort_controllers) соответствует EffortJointInterface
# в трансмиссиях URDF (lab1_4_arm_description/urdf/arm.transmission.xacro).
# Коэффициенты ПИД подобраны по моментам инерции звеньев:
# крупные звенья - большие коэффициенты, запястье и схват - малые.
arm:
  # Публикация положений всех шарниров в /arm/joint_states
  joint_state_controller:
    type: joint_state_controller/JointStateController
    publish_rate: 50

  # Управление положением шарниров (команда - угол в рад, тема .../command)
  joint1_position_controller:
    type: effort_controllers/JointPositionController
    joint: joint1
    pid: {p: 100.0, i: 0.0, d: 20.0}
  joint2_position_controller:
    type: effort_controllers/JointPositionController
    joint: joint2
    pid: {p: 100.0, i: 0.0, d: 20.0}
  joint3_position_controller:
    type: effort_controllers/JointPositionController
    joint: joint3
    pid: {p: 50.0, i: 0.0, d: 5.0}
  joint4_position_controller:
    type: effort_controllers/JointPositionController
    joint: joint4
    pid: {p: 5.0, i: 0.0, d: 0.2}
  joint5_position_controller:
    type: effort_controllers/JointPositionController
    joint: joint5
    pid: {p: 1.0, i: 0.0, d: 0.03}
