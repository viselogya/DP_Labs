joint_state_controller:
  type: joint_state_controller/JointStateController
  publish_rate: 30

drive_controller:
  type: diff_drive_controller/DiffDriveController
  left_wheel: left_wheel_joint
  right_wheel: right_wheel_joint
  wheel_separation: 0.296
  wheel_radius: 0.042
  base_frame_id: base_link
  odom_frame_id: odom
  enable_odom_tf: true
  publish_rate: 30.0
  cmd_vel_timeout: 0.35
  pose_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.02]
  twist_covariance_diagonal: [0.001, 0.001, 1000000.0, 1000000.0, 1000000.0, 0.02]
